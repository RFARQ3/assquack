[project]
name = "assquack"
version = "0.1.0"
description = "DuckDB-native data asset library."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "MAIT DEV Pty Ltd", email = "maitland@mait.dev" },
]
dependencies = [
    "duckdb>=1.5.0,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
]

[tool.poetry]
requires-poetry = ">=2.0"
packages = [
    { include = "assquack", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.0,<10.0.0"
pyright = ">=1.1.409,<2.0.0"
ruff = ">=0.14.0,<0.16.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = [
    "tests",
]

[tool.pyright]
include = [
    "src/assquack",
    "tests",
]
strict = [
    "src/assquack",
]
exclude = [
    "**/__pycache__",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.ruff]
extend-exclude = [
    ".agents",
    ".submodules",
]
line-length = 88
src = [
    "src",
    "tests",
]
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]
fixable = [
    "ALL",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]
build-backend = "poetry.core.masonry.api"
